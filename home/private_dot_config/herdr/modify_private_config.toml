{{- /* chezmoi:modify-template */ -}}
{{- /* herdr-projects' configure owns its tab-bar entry, popup key and sidebar rows. They are carried over from the current file, so plugin updates and chezmoi never undo each other. */ -}}
{{- $current := .chezmoi.stdin -}}
{{- $tab := regexFind `(?m)^tab_bar_right = .*herdr-projects.*$` $current -}}
{{- $popup := regexFind `(?m)^\[\[keys\.command\]\]\n(?:[a-z_]+ = .*\n)*?command = "herdr-projects\.open-popup"(?:\n[a-z_]+ = .*)*` $current -}}
{{- $agents := regexFind `(?m)^\[ui\.sidebar\.agents\]\nrows = .*$` $current -}}
{{- $spaces := regexFind `(?m)^\[ui\.sidebar\.spaces\]\nrows = .*$` $current -}}
onboarding = false

# Herdr owns multiplexing inside the single outer WezTerm surface.
[theme]
name = "catppuccin"
auto_switch = false

[ui]
sidebar_collapsed_mode = "compact"
agent_panel_sort = "priority"
window_title = "Herdr — {workspace} · {tab}"
mouse_scroll_lines = 5
status_indicators = "dots"
{{- with $tab }}
{{ . }}
{{- end }}

# WezTerm turns Herdr's OSC 9 notifications into macOS notifications.
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[terminal]
# On macOS this starts login shells, preserving Homebrew and user PATH setup.
shell_mode = "auto"
new_cwd = "follow"
kitty_graphics = true

[advanced]
scrollback_limit_bytes = 50000000

[keys]
# WezTerm intentionally has no Ctrl leader; this prefix belongs to Herdr.
prefix = "ctrl+b"
copy_mode = "prefix+["
edit_scrollback = "prefix+e"

# Available when the optional ray.plugin-manager plugin is installed.
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-tsk.quick-capture"
{{- with $popup }}

{{ . }}
{{- end }}

[ui.sound]
enabled = false
{{- with $agents }}

{{ . }}
{{- end }}
{{- with $spaces }}

{{ . }}
{{- end }}
