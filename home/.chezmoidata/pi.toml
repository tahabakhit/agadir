# Third-party Pi packages every machine gets. Provider packages are added per
# machine: the Vertex one only when a Vertex project is configured.
piPackages = [
  "git:github.com/edxeth/pi-subagents",
  "npm:pi-agent-ide",
  "npm:pi-blackhole",
]
piVertexPackage = "git:github.com/mandre/pi-anthropic-vertex@bump-pi"

# Skills Pi should not load: installed twice by other tools, or covered by a
# Pi-native feature (pi-toolkit's /independent mode replaces the independent skill).
piSkillExclusions = [
  "!**/.agents/skills/tsk-cli/**",
  "!**/.agents/skills/independent/**",
  "!**/last30days/**",
]

# Repository of the Agent Skills linked for Pi, Codex (~/.agents/skills) and
# Claude Code (~/.claude/skills); each linked skill has a symlink_ template.
agentSkillsRepo = "https://github.com/tahabakhit/agent-skills.git"

# Pi packages from this setup's own repositories. When agentsRoot is set, each
# one loads from its checkout at agentsRoot/<local> instead of its source.
[[ownPiPackages]]
source = "git:github.com/tahabakhit/pi-learn"
local = "pi/learn"

[[ownPiPackages]]
source = "git:github.com/tahabakhit/pi-toolkit"
local = "pi/toolkit"

[[ownPiPackages]]
source = "npm:@tahabakhit/pi-research-kit"
local = "pi/research-kit"
