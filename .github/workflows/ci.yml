name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: brew install chezmoi
      - run: npm test
      - run: test -z "$(gofmt -l skills)" && go vet ./skills/github-workflows/scripts/git_hygiene_audit.go
      - name: Render every chezmoi target with sample answers
        run: |
          tmp=$(mktemp -d)
          cz() { HOME=$tmp chezmoi --source "$PWD" --destination "$tmp" --config tests/chezmoi.toml --persistent-state "$tmp/state.boltdb" "$@"; }
          cz apply --exclude=scripts --verbose
          test -z "$(cz status --exclude=scripts)"
          test -f "$tmp/.pi/agent/settings.json" && test -f "$tmp/.claude/CLAUDE.md" && test -f "$tmp/.gitconfig"
      - name: Secret scan
        run: |
          brew install gitleaks
          gitleaks detect --no-banner --redact

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi and WezTerm
        shell: pwsh
        run: choco install chezmoi wezterm -y --no-progress
      - name: Apply on Windows and load the WezTerm config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force $dest | Out-Null

          # No answers are needed on Windows: the config template asks nothing.
          $config = chezmoi --source $PWD execute-template --init --no-tty --file home/.chezmoi.toml.tmpl
          $config
          if ($LASTEXITCODE -ne 0) { throw 'config template failed' }
          $configFile = Join-Path $env:RUNNER_TEMP 'chezmoi.toml'
          Set-Content -Path $configFile -Value $config

          chezmoi --source $PWD --destination $dest --config $configFile --persistent-state (Join-Path $env:RUNNER_TEMP 'state.boltdb') apply --verbose
          if ($LASTEXITCODE -ne 0) { throw 'chezmoi apply failed' }

          $files = Get-ChildItem -Recurse -File $dest | ForEach-Object { $_.FullName.Substring($dest.Length + 1) } | Sort-Object
          $files
          $expected = @('.config\wezterm\local.lua', '.config\wezterm\wezterm.lua')
          if (Compare-Object $files $expected) { throw 'Windows should get only the WezTerm config' }

          $wezterm = (Get-Command wezterm.exe -ErrorAction SilentlyContinue).Source
          if (-not $wezterm) { $wezterm = 'C:\Program Files\WezTerm\wezterm.exe' }
          $keys = & $wezterm --config-file (Join-Path $dest '.config\wezterm\wezterm.lua') show-keys 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $keys -notmatch 'ShowLauncher' -or $keys -match 'ERROR') { $keys; throw 'WezTerm could not load the config' }
          # Plain Ctrl+V (lowercase v) is bound only by the Windows branch of wezterm.lua.
          if ($keys -cnotmatch '(?m)^\s*CTRL\s+v\s+->\s+PasteFrom') { $keys; throw 'The Windows-only WezTerm settings did not apply' }
          'WezTerm loaded the config'
